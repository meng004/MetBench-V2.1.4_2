kind: MrSpec
mr_id: dif-phy-01
name: Boron concentration monotonicity
description: Higher boron concentration lowers k_eff.
tags:
  equation_key: Diffusion
  program_type: Deterministic
  source_report_id: MR-Dif-Phy-01
  sut_key: diffusion_1d
roles:
  low_boron:
    kind: Baseline
  high_boron:
    kind: Followup
projections:
  k_eff:
    kind: ScalarProjection
    path: /results/k_eff
predicates:
  - kind: BinaryComparison
    predicate_id: boron-monotonic
    left_role: high_boron
    right_role: low_boron
    metric: k_eff
    operator: Less
default_tolerance:
  kind: DeterministicTolerance
  atol: 1.0e-8
  rtol: 1.0e-5
