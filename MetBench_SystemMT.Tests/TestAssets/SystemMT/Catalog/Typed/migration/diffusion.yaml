kind: MrSpec
mr_id: dif-phy-03
name: Diffusion adjoint proportionality
description: Forward and adjoint flux fields should be proportional.
tags:
  equation_key: Diffusion
  program_type: Deterministic
  source_report_id: MR-Dif-Phy-03
  sut_key: diffusion_1d
roles:
  forward:
    kind: Baseline
  adjoint:
    kind: Followup
projections:
  flux_map:
    kind: Field2DProjection
    path: /results/flux_map
    rows: 2
    columns: 2
predicates:
  - kind: FieldProportionality
    predicate_id: adjoint-proportional
    left_role: adjoint
    right_role: forward
    left_metric: flux_map
    right_metric: flux_map
    estimator: LeastSquaresThroughOrigin
    tolerance:
      kind: FieldNormTolerance
      norm: L2
      atol: 1.0e-6
      rtol: 5.0e-2
default_tolerance:
  kind: DeterministicTolerance
  atol: 1.0e-8
  rtol: 1.0e-5
