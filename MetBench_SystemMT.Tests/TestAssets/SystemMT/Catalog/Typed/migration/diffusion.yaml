kind: MrSpec
mr_id: dif-phy-06
name: Symmetric loading yields symmetric power field
description: Symmetric cases should match after transpose pairing.
tags:
  equation_key: Diffusion
  program_type: Deterministic
  source_report_id: MR-Dif-Phy-06
  sut_key: diffusion_1d
roles:
  source:
    kind: Baseline
  mirror:
    kind: Followup
projections:
  power_map:
    kind: Field2DProjection
    path: /results/power_map
    rows: 3
    columns: 3
predicates:
  - kind: FieldEquality
    predicate_id: transpose-symmetry
    left_role: source
    right_role: mirror
    left_metric: power_map
    right_metric: power_map
    pairing:
      kind: Transpose
    tolerance:
      kind: FieldNormTolerance
      norm: LInf
      atol: 1.0e-6
      rtol: 1.0e-3
default_tolerance:
  kind: DeterministicTolerance
  atol: 0.0
  rtol: 0.0
