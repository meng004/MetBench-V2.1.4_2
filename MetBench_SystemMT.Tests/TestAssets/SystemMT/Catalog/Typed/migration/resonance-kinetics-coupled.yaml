kind: MrSpec
mr_id: res-alg-01
name: Subgroup convergence
description: More subgroups should reduce reference error.
tags:
  equation_key: Resonance
  program_type: Deterministic
  source_report_id: MR-Res-Alg-01
  sut_key: openmc
roles:
  subgroup8:
    kind: Baseline
  subgroup16:
    kind: Followup
  reference:
    kind: Reference
projections:
  sigma_eff:
    kind: ScalarProjection
    path: /results/sigma_eff
predicates:
  - kind: ErrorMonotonic
    predicate_id: subgroup-convergence
    ordered_roles: [subgroup8, subgroup16]
    reference_role: reference
    metric: sigma_eff
    norm_kind: Absolute
default_tolerance:
  kind: DeterministicTolerance
  atol: 0.0
  rtol: 0.0
