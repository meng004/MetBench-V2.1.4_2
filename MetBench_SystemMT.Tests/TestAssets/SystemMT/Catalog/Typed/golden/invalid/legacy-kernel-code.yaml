kind: MrSpec
mr_id: golden-invalid-missing-role
name: Golden invalid fixture with unresolved role
description: Deserializes successfully but must fail validation and dispatch as InvalidSpec.
roles:
  baseline:
    kind: Baseline
projections:
  k_eff:
    kind: ScalarProjection
    path: /results/k_eff
predicates:
  - kind: BinaryComparison
    predicate_id: unresolved-followup
    left_role: followup
    right_role: baseline
    metric: k_eff
    operator: Equal
default_tolerance:
  kind: DeterministicTolerance
  atol: 0.0
  rtol: 0.0
