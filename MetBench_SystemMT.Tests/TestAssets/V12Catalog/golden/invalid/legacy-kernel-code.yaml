kind: MrSpec
mr_id: golden-invalid-legacy
name: Golden invalid fixture with legacy field
description: Invalid fixture retained to assert anti-legacy linting.
roles:
  baseline:
    kind: Baseline
projections:
  k_eff:
    kind: ScalarProjection
    path: /results/k_eff
predicates:
  - kind: BinaryComparison
    predicate_id: legacy-invalid
    left_role: baseline
    right_role: baseline
    metric: k_eff
    operator: Equal
kernel_code: MP_eq
default_tolerance:
  kind: DeterministicTolerance
  atol: 0.0
  rtol: 0.0
