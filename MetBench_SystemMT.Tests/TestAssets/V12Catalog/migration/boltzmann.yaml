kind: MrSpec
mr_id: bol-alg-01
name: MOC track refinement convergence
description: More tracks should reduce reference error.
tags:
  equation_key: Boltzmann
  program_type: Deterministic
  source_report_id: MR-Bol-Alg-01
  sut_key: openmoc
roles:
  coarse_tracks:
    kind: Baseline
  fine_tracks:
    kind: Followup
  reference:
    kind: Reference
projections:
  k_eff:
    kind: ScalarProjection
    path: /results/k_eff
predicates:
  - kind: ErrorMonotonic
    predicate_id: moc-convergence
    ordered_roles: [coarse_tracks, fine_tracks]
    reference_role: reference
    metric: k_eff
    norm_kind: Absolute
default_tolerance:
  kind: DeterministicTolerance
  atol: 0.0
  rtol: 0.0
---
kind: MrSpec
mr_id: bol-alg-02
name: Monte Carlo variance follows one over sqrt N
description: Quadrupling particle count should halve the standard error.
tags:
  equation_key: Boltzmann
  program_type: Statistical
  source_report_id: MR-Bol-Alg-02
  sut_key: openmc
roles:
  n_particles:
    kind: Baseline
  four_n_particles:
    kind: Followup
projections:
  k_eff_stats:
    kind: StatisticalProjection
    mean_path: /results/k_eff_mean
    std_error_path: /results/k_eff_stderr
predicates:
  - kind: VarianceRatio
    predicate_id: mc-variance-ratio
    low_sample_role: n_particles
    high_sample_role: four_n_particles
    statistical_metric: k_eff_stats
    sample_ratio:
      kind: ConstantParameter
      value: 4.0
    tolerance:
      kind: StatisticalTolerance
      sigma_multiplier: 2.0
default_tolerance:
  kind: DeterministicTolerance
  atol: 0.0
  rtol: 0.0
