kind: MrSpec
mr_id: bol-phy-04
name: P0 scattering overestimates hydrogenous k_eff
description: P0 scattering should overpredict the P1 result in hydrogenous cases.
tags:
  equation_key: Boltzmann
  program_type: CrossMethod
  source_report_id: MR-Bol-Phy-04
  sut_key: openmoc
roles:
  p0:
    kind: Baseline
    method_binding:
      method_code: Scattering
      variant: P0
  p1:
    kind: Followup
    method_binding:
      method_code: Scattering
      variant: P1
projections:
  k_eff:
    kind: ScalarProjection
    path: /results/k_eff
predicates:
  - kind: CrossMethodComparison
    predicate_id: p0-overpredicts
    left_role: p0
    right_role: p1
    metric: k_eff
    operator: Greater
    tolerance:
      kind: DeterministicTolerance
      atol: 0.0
      rtol: 0.0
default_tolerance:
  kind: DeterministicTolerance
  atol: 0.0
  rtol: 0.0
