kind: MrSpec
mr_id: bol-phy-01
name: Flux normalization invariance
description: Scaling source power should not change k_eff.
tags:
  equation_key: Boltzmann
  program_type: Deterministic
  source_report_id: MR-Bol-Phy-01
  sut_key: openmoc
roles:
  base_power:
    kind: Baseline
  scaled_power:
    kind: Followup
projections:
  k_eff:
    kind: ScalarProjection
    path: /results/k_eff
predicates:
  - kind: BinaryComparison
    predicate_id: normalization-invariant
    left_role: scaled_power
    right_role: base_power
    metric: k_eff
    operator: Equal
default_tolerance:
  kind: DeterministicTolerance
  atol: 1.0e-8
  rtol: 1.0e-5
---
