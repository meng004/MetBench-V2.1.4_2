name: spec-freshness-monitor

# Phase 3 of the CI Cat B hardening plan
# (docs/superpowers/plans/2026-05-27-ci-governance-cat-b-hardening-plan.md).
#
# Cat B / D1+D2 class catches: a spec doc recommends an MR id ("top-1
# candidate = X") that never gets implemented and the spec gets stale. The
# T2/T3 chain Phase 4 spec wrote `burgers-timestep-convergence` as the top-1
# candidate; Phase 5 substituted `subchannel-friction-invariance` after
# empirical validation but the spec doc itself wasn't re-touched until PR
# #199 / D1. This workflow surfaces such drift weekly so future
# substitutions either ship the spec retraction in the same PR (per
# CLAUDE.md §12.4 R3) or are surfaced as an auto-issue within a week.
#
# P2 extension (v2 charter §3 module D + §6 P2 — see
# docs/superpowers/specs/2026-05-28-code-governance-v2-charter.md and
# docs/superpowers/plans/2026-05-28-p2-spec-freshness-orphan-spec-plan.md):
# the workflow also runs an orphan-spec audit that surfaces spec docs which
# exist under docs/superpowers/specs/ but are not referenced by the active
# plan index. Orphans get a separate `governance:orphan-spec` label.
#
# Behavior
# - Weekly cron Monday 06:00 UTC + manual workflow_dispatch.
# - Runs tools/spec_freshness_audit.py against current main.
# - For each stale claim (claimed MR id absent from catalog, spec >= 14 days
#   old, no nearby retraction wording), open or update a single GitHub
#   issue per spec file labelled `governance:stale-spec`.
# - For each orphan spec (no active-plan-index reference, not allowlisted),
#   open or update a single GitHub issue per spec file labelled
#   `governance:orphan-spec`.
# - Idempotent: re-runs do NOT create duplicate issues; existing issues are
#   updated with the current finding count.

on:
  schedule:
    - cron: '0 6 * * 1'    # Monday 06:00 UTC
  workflow_dispatch:
    inputs:
      age_days:
        description: 'Override minimum spec age in days (default 14)'
        required: false
        default: '14'

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50      # need commit timestamps for spec age

      - name: Run spec-freshness audit
        id: audit
        env:
          AGE_DAYS: ${{ inputs.age_days || '14' }}
        run: |
          python3 tools/spec_freshness_audit.py --age-days "$AGE_DAYS" > /tmp/stale.json
          echo "Audit output:"
          cat /tmp/stale.json
          echo "stale_count=$(jq 'length' /tmp/stale.json)" >> "$GITHUB_OUTPUT"

      - name: Open or update issues
        if: steps.audit.outputs.stale_count != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          label='governance:stale-spec'

          # Ensure the label exists (idempotent — gh prints a noisy error on
          # duplicate but does not fail the script).
          gh label create "$label" --color 'fbca04' --description 'Spec doc references an MR id absent from main' 2>/dev/null || true

          # Group stale findings by spec_file so each spec gets one issue.
          jq -r 'group_by(.spec_file) | .[] | @json' /tmp/stale.json | while read -r group_json; do
            spec_file=$(echo "$group_json" | jq -r '.[0].spec_file')
            spec_age=$(echo "$group_json" | jq -r '.[0].spec_age_days')
            count=$(echo "$group_json" | jq -r 'length')
            title="governance: stale spec — ${spec_file}"

            # Build issue body
            {
              echo "Spec file: \`${spec_file}\`"
              echo "Spec age on main: ${spec_age} days"
              echo "Stale MR-id claims: ${count}"
              echo ""
              echo "## Findings"
              echo "$group_json" | jq -r '.[] | "- L\(.line_number) claims MR id `\(.claimed_mr_id)` — not present in catalog. Line: `\(.line_text)`"'
              echo ""
              echo "## Action"
              echo "Per CLAUDE.md §12.4 R3: either (a) re-touch the spec to mark the claim REJECTED / REPLACED with reason, or (b) ship the claimed MR id."
              echo ""
              echo "Auto-generated by \`.github/workflows/spec-freshness-monitor.yml\`. Closing this issue without action will cause it to reappear on the next weekly run."
            } > /tmp/body.md

            # Dedup by exact title match. gh issue list returns matching issues
            # regardless of state; we only consider open ones for update.
            existing=$(gh issue list --state open --label "$label" --search "in:title \"${title}\"" --json number --jq '.[0].number' || echo '')
            if [ -n "$existing" ]; then
              echo "Updating existing issue #${existing}"
              gh issue edit "$existing" --body-file /tmp/body.md
            else
              echo "Opening new issue for ${spec_file}"
              gh issue create --title "$title" --label "$label" --body-file /tmp/body.md
            fi
          done

      - name: Report no-op when no stale claims found
        if: steps.audit.outputs.stale_count == '0'
        run: |
          echo "No stale spec claims detected — all 'top-1 candidate' / 'next gap-fill' / 'recommended MR' references resolve to MR ids in the current catalog."

      - name: Run orphan-spec audit
        id: orphan
        run: |
          python3 tools/spec_freshness_audit.py --check orphan > /tmp/orphan.json
          echo "Orphan-spec audit output:"
          cat /tmp/orphan.json
          echo "orphan_count=$(jq 'length' /tmp/orphan.json)" >> "$GITHUB_OUTPUT"

      - name: Open or update orphan-spec issues
        if: steps.orphan.outputs.orphan_count != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          label='governance:orphan-spec'

          # Ensure the label exists (idempotent — gh prints a noisy error on
          # duplicate but does not fail the script).
          gh label create "$label" --color 'd93f0b' --description 'Spec doc not referenced by active-plan-index.md' 2>/dev/null || true

          # One finding per spec_file; emit one issue per orphan spec.
          jq -c '.[]' /tmp/orphan.json | while read -r finding_json; do
            spec_file=$(echo "$finding_json" | jq -r '.spec_file')
            spec_age=$(echo "$finding_json" | jq -r '.spec_age_days')
            reason=$(echo "$finding_json" | jq -r '.reason')
            title="governance: orphan spec — ${spec_file}"

            # Build issue body
            {
              echo "Spec file: \`${spec_file}\`"
              echo "Spec age on main: ${spec_age} days"
              echo ""
              echo "## Finding"
              echo "${reason}"
              echo ""
              echo "## Action"
              echo "Per CLAUDE.md §12.4 R3 + v2 charter §3 module D / §6 P2: either"
              echo "(a) register \`${spec_file}\` in \`docs/superpowers/plans/2026-05-25-metbench-active-plan-index.md\` (active / conditional / historical section as appropriate),"
              echo "(b) add the spec to \`.github/governance/orphan-spec-allowlist.txt\` with an explicit 'why' comment, or"
              echo "(c) retire / delete the spec if it is genuinely obsolete."
              echo ""
              echo "Auto-generated by \`.github/workflows/spec-freshness-monitor.yml\`. Closing this issue without action will cause it to reappear on the next weekly run."
            } > /tmp/orphan_body.md

            # Dedup by exact title match across open issues.
            existing=$(gh issue list --state open --label "$label" --search "in:title \"${title}\"" --json number --jq '.[0].number' || echo '')
            if [ -n "$existing" ]; then
              echo "Updating existing issue #${existing}"
              gh issue edit "$existing" --body-file /tmp/orphan_body.md
            else
              echo "Opening new issue for ${spec_file}"
              gh issue create --title "$title" --label "$label" --body-file /tmp/orphan_body.md
            fi
          done

      - name: Report no-op when no orphan specs found
        if: steps.orphan.outputs.orphan_count == '0'
        run: |
          echo "No orphan specs detected — every spec under docs/superpowers/specs/ is referenced by the active-plan-index or explicitly allowlisted."
