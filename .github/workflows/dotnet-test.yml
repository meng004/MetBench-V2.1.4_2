name: dotnet-test

on:
  push:
    branches: [main]
  pull_request:

# Cancel in-progress runs of the same workflow on the same ref. Saves
# minutes when a PR is rebased mid-build.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    env:
      # Pin Python to the apt-installed scientific stack's ABI. The
      # OpenMOC venv must use the same minor version or _openmoc.so won't
      # load.
      PY_MINOR: "3.12"
      OPENMOC_REF: "3D-MOC"
      VENV_DIR: /opt/openmoc-venv

    steps:
      - uses: actions/checkout@v4

      - name: Show pre-installed toolchain
        run: |
          set -x
          dotnet --list-sdks
          dotnet --version
          python3 --version
          /usr/bin/python${PY_MINOR} --version || echo "WARN: python${PY_MINOR} not on PATH"
          uname -a
          df -h /opt /tmp /home

      - name: Restore OpenMOC venv from cache
        id: cache-openmoc
        uses: actions/cache@v4
        with:
          path: ${{ env.VENV_DIR }}
          key: openmoc-${{ runner.os }}-py${{ env.PY_MINOR }}-${{ env.OPENMOC_REF }}-${{ hashFiles('.claude/web-setup.sh', '.github/workflows/dotnet-test.yml') }}

      - name: Show cache outcome
        run: |
          echo "cache-hit: ${{ steps.cache-openmoc.outputs.cache-hit }}"
          ls -la "${VENV_DIR}" 2>&1 || echo "venv dir absent"

      - name: apt-get update
        if: steps.cache-openmoc.outputs.cache-hit != 'true'
        run: |
          set -x
          sudo apt-get update -y

      - name: apt-get install OpenMOC build deps
        if: steps.cache-openmoc.outputs.cache-hit != 'true'
        run: |
          set -x
          sudo apt-get install -y --no-install-recommends \
              build-essential \
              swig \
              libhdf5-dev \
              python${{ env.PY_MINOR }}-dev \
              python${{ env.PY_MINOR }}-venv \
              python3-numpy \
              python3-h5py \
              python3-matplotlib

      - name: Create venv at ${{ env.VENV_DIR }}
        if: steps.cache-openmoc.outputs.cache-hit != 'true'
        run: |
          set -x
          sudo mkdir -p "${VENV_DIR}"
          sudo chown -R "$USER" "${VENV_DIR}"
          # --system-site-packages so we inherit apt-installed numpy/h5py/matplotlib.
          # No pip/setuptools upgrade: OpenMOC's legacy setup.py needs setuptools < 70.
          /usr/bin/python${PY_MINOR} -m venv --system-site-packages "${VENV_DIR}"
          "${VENV_DIR}/bin/python" --version
          "${VENV_DIR}/bin/pip" --version
          "${VENV_DIR}/bin/python" -c "import setuptools; print('setuptools', setuptools.__version__)"

      - name: Clone OpenMOC ${{ env.OPENMOC_REF }}
        if: steps.cache-openmoc.outputs.cache-hit != 'true'
        run: |
          set -x
          rm -rf /tmp/OpenMOC
          git clone --depth=1 --branch "${OPENMOC_REF}" \
              https://github.com/mit-crpg/OpenMOC.git /tmp/OpenMOC
          ls /tmp/OpenMOC/openmoc/ | head -20

      - name: Patch Python 3.10+ collections.Iterable
        if: steps.cache-openmoc.outputs.cache-hit != 'true'
        run: |
          set -x
          for f in /tmp/OpenMOC/openmoc/checkvalue.py \
                   /tmp/OpenMOC/openmoc/plotter.py \
                   /tmp/OpenMOC/openmoc/process.py; do
              [ -f "$f" ] && \
                  sed -i 's/from collections import Iterable/from collections.abc import Iterable/g' "$f"
          done

      - name: Build OpenMOC C extension (setup.py build_ext --inplace)
        if: steps.cache-openmoc.outputs.cache-hit != 'true'
        working-directory: /tmp/OpenMOC
        run: |
          set -ex
          "${VENV_DIR}/bin/python" setup.py build_ext --inplace
          echo "--- expecting _openmoc.so under openmoc/ ---"
          ls -la openmoc/_openmoc*.so

      - name: pip install OpenMOC pure-Python wheel
        if: steps.cache-openmoc.outputs.cache-hit != 'true'
        working-directory: /tmp/OpenMOC
        run: |
          set -ex
          "${VENV_DIR}/bin/pip" install --no-build-isolation .

      - name: Copy SWIG-generated _openmoc.so + openmoc.py into venv
        if: steps.cache-openmoc.outputs.cache-hit != 'true'
        run: |
          set -ex
          SITE_PACKAGES="$(${VENV_DIR}/bin/python -c 'import site; print(site.getsitepackages()[0])')"
          echo "site-packages: ${SITE_PACKAGES}"
          ls -la "${SITE_PACKAGES}/openmoc/" | head
          cp /tmp/OpenMOC/openmoc/_openmoc*.so "${SITE_PACKAGES}/openmoc/"
          cp /tmp/OpenMOC/openmoc/openmoc.py   "${SITE_PACKAGES}/openmoc/"
          "${VENV_DIR}/bin/python" -c "import openmoc; print('openmoc imported OK')"

      - name: Restore NuGet packages
        run: dotnet restore MetBench_SystemMT.Tests/MetBench_SystemMT.Tests.csproj

      - name: Build test project
        run: dotnet build MetBench_SystemMT.Tests/MetBench_SystemMT.Tests.csproj --no-restore --nologo

      - name: Run tests
        env:
          METBENCH_OPENMOC_PYTHON: ${{ env.VENV_DIR }}/bin/python
        run: |
          dotnet test MetBench_SystemMT.Tests/MetBench_SystemMT.Tests.csproj \
              --no-build --nologo --logger "console;verbosity=normal"
