name: dotnet-test

on:
  push:
    branches: [main]
  pull_request:

# Cancel in-progress runs of the same workflow on the same ref. Saves
# minutes when a PR is rebased mid-build.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Show pre-installed toolchain
        run: |
          dotnet --list-sdks
          dotnet --version
          python3 --version
          uname -a

      - name: Restore NuGet packages
        run: dotnet restore MetBench_SystemMT.Tests/MetBench_SystemMT.Tests.csproj

      - name: Build test project
        run: dotnet build MetBench_SystemMT.Tests/MetBench_SystemMT.Tests.csproj --no-restore --nologo

      - name: Run tests
        # OpenMOC is intentionally NOT installed in this CI workflow yet.
        # Stage 3 BDD scenarios and the OpenMOC smoke test detect this via
        # OpenMocTestPaths.OpenMocImportable() and Skip.IfNot, so they skip
        # cleanly. The remaining 49+ tests still gate every PR.
        #
        # Earlier revisions of this workflow tried to build OpenMOC inline
        # using the same apt + SWIG layout that the cloud sandbox uses
        # (see PR #8 / .claude/web-setup.sh). The cold build in CI failed
        # at `setup.py build_ext --inplace` for reasons we could not diagnose
        # from inside the cloud sandbox (workflow logs are served from
        # productionresultssa*.blob.core.windows.net which is firewalled
        # off here). Adding OpenMOC to CI is tracked as a follow-up - keep
        # the gate working in the meantime.
        run: |
          dotnet test MetBench_SystemMT.Tests/MetBench_SystemMT.Tests.csproj \
              --no-build --nologo \
              --logger "console;verbosity=normal" \
              --logger "trx;LogFileName=test-results.trx" \
              --results-directory TestResults

      - name: Performance baseline check (F14)
        # 性能回归 gate：
        #   • 总时长 > 120s → fail（v2 ship 时基线 ~15s；3× margin 防设备波动）
        #   • 单个 test > 2000ms → warn（保留 OpenMOC subprocess timeout 等真慢测试余地）
        # 数据来自 trx 文件（vstest 标准结构）。
        if: always()
        run: |
          python3 tools/ci_perf_baseline.py \
              --trx TestResults/test-results.trx \
              --total-budget-seconds 120 \
              --per-test-warn-ms 2000

  # Mechanical governance grep replaces the prior anthropics/claude-code-action +
  # openai/codex-action AI review workflow (`.github/workflows/pr-soft-review.yml`).
  # Rationale: CLAUDE.md §12.4 R1/R3/R4 and §12.5 mechanized most of what AI review
  # claimed to catch (parity facts, contract-honor facts, architecture guards) into
  # hard `test`. The remaining governance items below are pure pattern matches —
  # cheaper, faster, deterministic, no token spend, no anti-injection failures.
  # Failures here are advisory: they post a GH Actions ::warning:: but do NOT fail
  # the workflow (would otherwise need a separate required-check name; we keep
  # `test` as the single hard gate per CLAUDE.md §12.1).
  governance:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: PR body + diff inline governance checks
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          fail=0
          warn() { echo "::warning::$1"; fail=$((fail + 1)); }

          body=$(gh pr view "$PR_NUMBER" --json body --jq .body)
          diff_files=$(git diff --name-only "$PR_BASE_SHA"..HEAD)

          # Check 1 — Plan traceability (CLAUDE.md §11 / §12.4 R2):
          # any non-docs-only PR should cite either an active plan path,
          # a T#-anchor (T0..T6), or a CLAUDE.md / spec doc anchor in the body.
          if ! echo "$diff_files" | grep -qvE '^docs/|\.md$'; then
            : # docs-only PR — plan citation optional
          elif ! echo "$body" | grep -qE 'docs/superpowers/(plans|specs)/|\bT[0-6]\b|CLAUDE\.md|PR-[A-Za-z0-9]'; then
            warn "Plan traceability: PR body cites no active plan / T-anchor / spec / PR-id (CLAUDE.md §12.4 R2)"
          fi

          # Check 2 — Status truth (CLAUDE.md §11.3):
          # changes to catalog (SUT/<sut>/catalog.json or LegacyCatalogFactory.cs) that
          # bump the MR inventory must also touch docs/status/current.md.
          if echo "$diff_files" | grep -qE 'SUT/[^/]+/catalog\.json|LegacyCatalogFactory\.cs'; then
            inv_delta=$(git diff "$PR_BASE_SHA"..HEAD -- 'SUT/*/catalog.json' 'MetBench_BLL.Core/SystemMT/Launcher/LegacyCatalogFactory.cs' \
              | grep -c '^[+-][^+-].*"mr_id"' || true)
            if [ "$inv_delta" -gt 0 ] && ! echo "$diff_files" | grep -q 'docs/status/current\.md'; then
              warn "Status truth: catalog touched with MR-id delta but docs/status/current.md not in diff (CLAUDE.md §11.3)"
            fi
          fi

          # Check 3 — Windows classification (CLAUDE.md §9 / §12.4):
          # if MetBench_Client/ or *.xaml* is touched, PR body must mention Windows
          # verification (RDP / VM / FlaUI / Windows VM) or it must be an explicit
          # Windows-only PR (e.g. title prefix or label).
          if echo "$diff_files" | grep -qE '^MetBench_Client/|\.xaml'; then
            if ! echo "$body" | grep -qiE 'Windows VM|RDP|FlaUI|Parallels|Windows-only|VM evidence'; then
              warn "Windows classification: WPF/MetBench_Client touched but PR body does not document Windows verification (CLAUDE.md §3 / §9)"
            fi
          fi

          # Check 4 — Docs-only baseline misclaim (CLAUDE.md §12.4):
          # if diff is docs-only (all paths under docs/ or *.md), PR body should
          # not claim a new code-test baseline (no "passed: NNNN" / "X / 0 / Y" pattern
          # except as a quote of an existing baseline).
          if ! echo "$diff_files" | grep -qvE '^docs/|\.md$'; then
            if echo "$body" | grep -qE 'NEW baseline|new baseline.*passed|baseline:.*passed'; then
              warn "Docs-only baseline misclaim: PR is docs-only but body claims a new code-test baseline (CLAUDE.md §12.4)"
            fi
          fi

          # Check 5 — PR Gate Checklist 7 sections (CLAUDE.md §12.2):
          # PR body should carry the 7 mandatory section headers.
          for section in '1\. Scope' '2\. Facts' '3\. Tests' '4\. Windows' '5\. Review' '6\. Merge' '7\. Soft Review'; do
            if ! echo "$body" | grep -qE "(##|###) +$section"; then
              warn "PR Gate Checklist: missing section header matching '$section' (CLAUDE.md §12.2 / docs/superpowers/templates/pr-gate-checklist.md)"
            fi
          done

          # Check 6 (G6) — silent-discard pattern (Cat A, B1 / Excel ReportContext class):
          # `_ = expr ?? default;` evaluates expr then discards the coalesced value.
          # Each occurrence is a candidate "claim without implementation" bug.
          # See docs/superpowers/specs/2026-05-27-t2-t3-chain-post-merge-review.md §2 B1.
          if git diff "$PR_BASE_SHA"..HEAD -- '**/*.cs' 2>/dev/null | grep -qE '^\+\s*_ = .* \?\? '; then
            warn "G6 silent-discard: '_ = … ?? …' pattern detected in diff. Verify the coalesced value is intentionally unused (CLAUDE.md §12.4 R4)."
          fi

          # Check 8 (G8) — § 12.4 R1 parity-test hint (Cat A/B border, L1 / FromBlueprint MetaPattern class):
          # public field added to a type in MetBench_BLL.Core/ probably has multi-projection
          # paths. Warn if no ParityTests file was touched in the same diff.
          added_fields=$(git diff "$PR_BASE_SHA"..HEAD -- 'MetBench_BLL.Core/**/*.cs' 2>/dev/null \
                          | grep -cE '^\+\s+public (string|int|long|double|bool|TimeSpan|IReadOnlyList|IReadOnlyDictionary|Guid)[^=(]* \{ (get|init)' \
                          || echo 0)
          if [ "${added_fields:-0}" -gt 0 ] && ! echo "$diff_files" | grep -qE 'ParityTests\.cs$'; then
            warn "G8 R1 parity hint: ${added_fields} public field(s) added in MetBench_BLL.Core but no *ParityTests.cs touched. Verify the type has no multi-projection paths, or add a parity assertion (CLAUDE.md §12.4 R1)."
          fi

          # Check 9 (G9) — Stage-8 ledger 'Controlled' row without post-merge-review.md (Cat B, D1/D2 class):
          # CLAUDE.md §12.4 R2 mandates ≥ 3-PR chains produce a post-merge-review.md AND the
          # Stage-8 row cross-links it. T2/T3 chain originally violated this; G9 catches recurrence.
          new_stage8=$(git diff "$PR_BASE_SHA"..HEAD -- 'docs/status/current.md' 2>/dev/null \
                        | grep -cE '^\+\|.*Controlled.*— [0-9]+-phase' || echo 0)
          if [ "${new_stage8:-0}" -gt 0 ]; then
            if ! git diff "$PR_BASE_SHA"..HEAD -- 'docs/status/current.md' 2>/dev/null \
                  | grep -qE '^\+.*docs/superpowers/specs/.*post-merge-review'; then
              warn "G9 Stage-8 chain-end review: new 'Controlled — N-phase' Stage-8 row added but no post-merge-review.md cross-link in the row (CLAUDE.md §12.4 R2)."
            fi
          fi

          # Check 10 (G10) — multi-projection record discipline (Cat B, L1 / FromBlueprint MetaPattern class):
          # Reads .github/governance/multi-projection-types.txt and, for each registered
          # type whose declaration file appears in the diff with a field addition,
          # requires the registered ParityTests file to be touched in the same PR.
          # Types registered as NONE emit a stronger reminder warning.
          # Phase 4 Roslyn analyzer will supersede this list-based check.
          registry='.github/governance/multi-projection-types.txt'
          if [ -f "$registry" ]; then
            while IFS='=' read -r type_name parity_paths; do
              # Skip comments and blanks
              case "$type_name" in ''|'#'*) continue ;; esac
              # Find the declaration file(s) of the type by grepping for a record /
              # class declaration. Types may be declared inline in larger files
              # (e.g. MrCatalogEntry lives inside SystemMtLauncher.cs), so we cannot
              # rely on the <TypeName>.cs convention.
              decl_files=$(grep -rlE "(public|internal) (sealed )?(record|class) ${type_name}\\b" \
                             MetBench_BLL.Core MetBench_BLL 2>/dev/null || true)
              if [ -z "$decl_files" ]; then
                continue
              fi
              # Did this PR add a public field on that type? (Heuristic: any line starting with `+ public`
              # inside the declaration file diff.) This is conservative: an in-file addition that lands
              # outside the type's record body would also trigger; reviewers downgrade as needed.
              added_in_type=0
              for decl in $decl_files; do
                if git diff "$PR_BASE_SHA"..HEAD -- "$decl" 2>/dev/null \
                     | grep -qE '^\+\s+public (string|int|long|double|bool|TimeSpan|IReadOnlyList|IReadOnlyDictionary|Guid)[^=(]* \{ (get|init)'; then
                  added_in_type=1
                  break
                fi
              done
              if [ "$added_in_type" -eq 1 ]; then
                if [ "$parity_paths" = "NONE" ]; then
                  warn "G10 multi-projection: ${type_name} gained a public field but the type has NO ParityTests registered. Either add one and update .github/governance/multi-projection-types.txt, or document why projection-parity is not applicable (CLAUDE.md §12.4 R1)."
                else
                  parity_ok=0
                  IFS=',' read -ra paths <<< "$parity_paths"
                  for path in "${paths[@]}"; do
                    if echo "$diff_files" | grep -qE "^${path}$"; then
                      parity_ok=1
                      break
                    fi
                  done
                  if [ "$parity_ok" -eq 0 ]; then
                    warn "G10 multi-projection: ${type_name} gained a public field but none of its registered ParityTests (${parity_paths}) was touched. Add a parity assertion (CLAUDE.md §12.4 R1)."
                  fi
                fi
              fi
            done < "$registry"
          fi

          # Check 11 (G11) — decision-record-or-die for new-module paths (Cat B prevention):
          # A PR that creates a NEW file under any registered "new-module" path family
          # must declare a decision record in the PR body via the `decision-record:`
          # substring (per docs/superpowers/templates/decision-record-template.md).
          # Mirrors the §5.x decision-record discipline established by
          # docs/superpowers/specs/2026-05-26-t3-coverage-assessment-and-next-sut-decision.md.
          new_module_files=$(git diff --name-only --diff-filter=A "$PR_BASE_SHA"..HEAD \
                              | grep -E '^(MetBench_BLL\.Core/SystemMT/Reporting/.*Renderer\.cs|MetBench_BLL\.Core/SystemMT/Catalog/Typed/Runtime/.*Kernel\.cs|MetBench_BLL\.Core/Discovery/.*Discoverer\.cs|MetBench_BLL\.Core/SystemMT/Anomaly/.*\.cs)$' \
                              || true)
          if [ -n "$new_module_files" ]; then
            if ! echo "$body" | grep -qE 'decision-record:'; then
              warn "G11 decision-record-or-die: new module file(s) added without a 'decision-record:' citation in PR body. Files: $(echo "$new_module_files" | tr '\n' ' '). Add 'decision-record: docs/superpowers/specs/YYYY-MM-DD-<topic>-decision.md' (or 'decision-record: N/A (internal-helper / refactor / file-split)') per docs/superpowers/templates/decision-record-template.md (v2 charter §6 P7)."
            fi
          fi

          # Check 12 (G12) — WPF MessageBox namespace ambiguity guard (Cat B prevention):
          # Files under MetBench_Client/ that import BOTH System.Windows AND
          # Wpf.Ui.Controls and use the static-call pattern `MessageBox.Show(`
          # (or .ShowDialog / .ShowAsync / .ShowDialogAsync) or enum-value
          # access `MessageBox{Button,Result,Image}.<member>` WITHOUT a
          # `System.Windows.` or `Wpf.Ui.Controls.` namespace prefix will fail
          # compile on Windows with CS0104 because Wpf.Ui.Controls.MessageBox
          # shadows System.Windows.MessageBox.
          #
          # The instance-construction pattern `new Wpf.Ui.Controls.MessageBox{}`
          # (used in pre-existing Method MT pages) is intentional and not
          # ambiguous — only the static-call / static-enum pattern is risky.
          #
          # Linux CI cannot compile MetBench_Client.csproj (MSB4019), so this
          # grep is the only pre-merge guard. T1 non-MR CRUD chain hit this 3x
          # (PR #223 / #225 / #224); rule codified as G12 by PR-FUP-1.
          dual_using_files=$(grep -rlE '^using System\.Windows;' MetBench_Client/ 2>/dev/null \
                              | xargs -I{} grep -lE '^using Wpf\.Ui\.Controls;' {} 2>/dev/null \
                              || true)
          unqualified_violations=""
          if [ -n "$dual_using_files" ]; then
            for f in $dual_using_files; do
              # Look for risky usages: either `MessageBox.Show*(` static call or
              # `MessageBox{Button,Result,Image}.<member>` enum-value access.
              risky=$(grep -nE '\b(MessageBox\.(Show|ShowDialog|ShowAsync|ShowDialogAsync)\(|MessageBox(Button|Result|Image)\.[A-Za-z])' "$f" || true)
              # Filter out lines that already qualify with System.Windows. or
              # Wpf.Ui.Controls.
              bare=$(echo "$risky" | grep -vE '(System\.Windows|Wpf\.Ui\.Controls)\.(MessageBox|MessageBoxButton|MessageBoxResult|MessageBoxImage)' || true)
              if [ -n "$bare" ]; then
                unqualified_violations="$unqualified_violations $f"
              fi
            done
          fi
          if [ -n "$unqualified_violations" ]; then
            warn "G12 WPF MessageBox namespace ambiguity: file(s) import both System.Windows and Wpf.Ui.Controls and reference MessageBox.Show( / MessageBox{Button,Result,Image} without fully qualifying as System.Windows.* — will hit CS0104 on Windows build. Fix by qualifying as System.Windows.MessageBox.Show(...) etc. Files:$unqualified_violations"
          fi

          echo "Governance grep result: $fail warning(s). Hard 'test' gate is the only blocker."
          # Exit 0 unconditionally — advisory only, matches the prior AI-review semantics.
          exit 0
