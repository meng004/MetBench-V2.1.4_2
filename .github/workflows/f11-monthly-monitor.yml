name: F11 m_adj monthly monitor

# F11 adjoint-unlock RFC §4 (path A passive-wait): poll OpenMOC upstream once
# per month for any commits mentioning "adjoint". If hits found, post an issue
# so the team evaluates pulling the patch into the metbench OpenMOC venv.
#
# RFC: docs/superpowers/plans/2026-05-17-f11-unlock-rfc.md
# Status: docs/superpowers/plans/2026-05-17-f11-status.md

on:
  schedule:
    # 03:17 UTC on the 1st of every month — off-peak to avoid clashing with
    # other repo CI bursts.
    - cron: "17 3 1 * *"
  workflow_dispatch: {}  # allow manual trigger from Actions tab

jobs:
  monitor:
    runs-on: ubuntu-24.04
    permissions:
      issues: write       # post a tracking issue if adjoint commits found
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get install -y --no-install-recommends jq

      - name: Run monitor
        id: monitor
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          output="$(./tools/check_openmoc_adjoint.sh 2>&1)"
          ec=$?
          {
            echo "exit_code=$ec"
            echo "found_adjoint=$(echo "$output" | grep -c 'mentioning .adjoint.' || true)"
            echo "output<<EOF"
            echo "$output"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "$output"
          exit $ec

      - name: Open tracking issue if adjoint commits found
        if: steps.monitor.outputs.found_adjoint != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const out = `${{ steps.monitor.outputs.output }}`;
            const today = new Date().toISOString().slice(0, 10);
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[F11 monitor] OpenMOC adjoint-related commits detected (${today})`,
              body: [
                "Monthly F11 monitor (path A passive-wait) found upstream activity:",
                "",
                "```",
                out,
                "```",
                "",
                "Action: evaluate each commit; if adjoint flux export is implemented,",
                "pull the patch into `/opt/openmoc-venv` and flip m_adj MetaPattern",
                "Status from `out-of-scope` → `active`.",
                "",
                "RFC: docs/superpowers/plans/2026-05-17-f11-unlock-rfc.md",
                "Status: docs/superpowers/plans/2026-05-17-f11-status.md",
              ].join("\n"),
              labels: ["f11-monitor", "rfc-followup"],
            });
